name = "family-practice"
send_metrics = false
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

[ai]
binding = "AI"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "FAMILY"
class_name = "FamilyDatabase"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "RegistryLimits"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FamilyDatabase", "RegistryLimits"]

[[durable_objects.bindings]]
name = "TTS_CACHE"
class_name = "TtsCache"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TtsCache"]

[observability]
enabled = true
head_sampling_rate = 1
