name = "family-practice"
send_metrics = false
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

[ai]
binding = "AI"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "FAMILY"
class_name = "FamilyDatabase"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "RegistryLimits"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FamilyDatabase", "RegistryLimits"]

[[durable_objects.bindings]]
name = "TTS_CACHE"
class_name = "TtsCache"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TtsCache"]

[[durable_objects.bindings]]
name = "SHARES"
class_name = "ShareStore"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ShareStore"]

[observability]
enabled = true
head_sampling_rate = 1

# Connection URLs contain bearer credentials; never record invocation URLs.
[observability.logs]
enabled = true
invocation_logs = false

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "AccountStore"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["AccountStore"]

[[services]]
binding = "ACCOUNTS_SVC"
service = "jesklabs-accounts"
entrypoint = "SpellingClient"

[vars]
SIGNIN_EMAIL = "0"
SIGNIN_GOOGLE = "0"
APP_ORIGIN = "https://spellami.jesklabs.com"
LEGACY_HOSTS = "spelling.jesklabs.com"
EMAIL_FROM = "Spellami <spellami@jesklabs.com>"

[triggers]
crons = ["0 * * * *"]
